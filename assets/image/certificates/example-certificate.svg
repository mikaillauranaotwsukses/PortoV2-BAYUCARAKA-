<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9B36C"/>
      <stop offset="50%" stop-color="#F2DCA9"/>
      <stop offset="100%" stop-color="#C89B4A"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C983"/>
      <stop offset="100%" stop-color="#B98E3F"/>
    </linearGradient>
  </defs>

  <!-- dasar kertas -->
  <rect width="1200" height="850" fill="#FBF7F1"/>

  <!-- bingkai luar navy -->
  <rect x="34" y="34" width="1132" height="782" fill="none" stroke="#123358" stroke-width="3"/>
  <!-- bingkai dalam emas -->
  <rect x="52" y="52" width="1096" height="746" fill="none" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- ornamen sudut -->
  <g stroke="#C89B4A" stroke-width="2" fill="none">
    <path d="M72 120 L72 72 L120 72"/>
    <path d="M1128 120 L1128 72 L1080 72"/>
    <path d="M72 730 L72 778 L120 778"/>
    <path d="M1128 730 L1128 778 L1080 778"/>
  </g>

  <!-- emblem -->
  <g transform="translate(600,140)">
    <circle r="42" fill="none" stroke="#123358" stroke-width="2.5"/>
    <circle r="33" fill="none" stroke="#C89B4A" stroke-width="1"/>
    <path d="M-14 8 L0 -18 L14 8 L0 2 Z" fill="#123358"/>
    <text x="0" y="26" font-family="Georgia, serif" font-size="11" fill="#123358" text-anchor="middle" letter-spacing="2">ITS</text>
  </g>

  <!-- judul -->
  <text x="600" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="62"
        fill="#123358" text-anchor="middle" letter-spacing="14">SERTIFIKAT</text>
  <line x1="430" y1="276" x2="770" y2="276" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="600" y="306" font-family="Georgia, serif" font-size="17" fill="#B98E3F"
        text-anchor="middle" letter-spacing="7">OF COMPLETION</text>

  <!-- pemberian kepada -->
  <text x="600" y="372" font-family="Georgia, serif" font-size="17" font-style="italic"
        fill="#5A6470" text-anchor="middle">Diberikan kepada</text>

  <text x="600" y="452" font-family="Georgia, serif" font-size="50" fill="#123358"
        text-anchor="middle" font-weight="bold">Muhammad Mikail</text>
  <line x1="360" y1="474" x2="840" y2="474" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- keterangan -->
  <text x="600" y="516" font-family="Georgia, serif" font-size="16" fill="#5A6470"
        text-anchor="middle">atas partisipasinya sebagai Peserta</text>

  <text x="600" y="588" font-family="Georgia, serif" font-size="30" fill="#123358"
        text-anchor="middle" font-weight="bold">Web Development Bootcamp 2026</text>

  <text x="600" y="624" font-family="Georgia, serif" font-size="15" fill="#6B7280"
        text-anchor="middle">diselenggarakan oleh Departemen Teknologi Informasi ITS</text>

  <!-- tanda tangan kiri -->
  <g transform="translate(215,700)">
    <path d="M-95 0 q18 -34 34 -8 q10 16 22 -6 q12 -22 24 4 q8 18 20 -4"
          fill="none" stroke="#123358" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-105" y1="18" x2="75" y2="18" stroke="#9AA3AE" stroke-width="1"/>
    <text x="-15" y="40" font-family="Georgia, serif" font-size="13" fill="#5A6470"
          text-anchor="middle">Dr. Ir. Ketua Program Studi</text>
  </g>

  <!-- segel kanan -->
  <g transform="translate(985,700)">
    <circle r="46" fill="url(#seal)" stroke="#B98E3F" stroke-width="2"/>
    <circle r="36" fill="none" stroke="#7A5C22" stroke-width="1"/>
    <text x="0" y="-4" font-family="Georgia, serif" font-size="10" fill="#5C4418"
          text-anchor="middle" letter-spacing="1">SERTIFIKAT</text>
    <text x="0" y="10" font-family="Georgia, serif" font-size="9" fill="#5C4418"
          text-anchor="middle" letter-spacing="1">RESMI</text>
    <text x="0" y="24" font-family="Georgia, serif" font-size="12" fill="#5C4418"
          text-anchor="middle">2026</text>
  </g>

  <!-- nomor sertifikat -->
  <text x="600" y="790" font-family="'Courier New', monospace" font-size="11" fill="#9AA3AE"
        text-anchor="middle" letter-spacing="2">NO. 001/ITS-TI/CERT/2026</text>
</svg>
